version: 2.1

jobs:
  php-tests:
    docker:
      - image: cimg/php:8.3-node
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
            - composer-v1-
      - run:
          name: Install Composer dependencies
          command: composer install --no-interaction --prefer-dist --no-progress
      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor
      - run:
          name: Bootstrap Laravel
          command: |
            cp .env.example .env
            php artisan key:generate
      - run:
          name: Enforce storage boundary
          command: php scripts/check-storage-boundary.php
      - run:
          name: Check PHP formatting
          command: vendor/bin/pint --test
      - run:
          name: Run tests
          command: php artisan test --stop-on-failure

  frontend:
    docker:
      - image: cimg/php:8.3-node
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install frontend dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run frontend quality checks
          command: npm run check

  release:
    docker:
      - image: cimg/php:8.3-node
    steps:
      - checkout
      - run:
          name: Fetch release history and tags
          command: git fetch --force --tags origin '+refs/heads/main:refs/remotes/origin/main'
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install release dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Verify GitHub release credentials
          command: |
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "Set GH_TOKEN in CircleCI project environment variables before enabling releases." >&2
              exit 1
            fi
      - run:
          name: Create semantic GitHub release
          command: GIT_CREDENTIALS="x-access-token:${GH_TOKEN}" npx -p node@v24 -c "npm run release"
      - store_artifacts:
          path: dist
          destination: releases

workflows:
  verify-and-release:
    jobs:
      - php-tests:
          filters:
            tags:
              ignore: /.*/
      - frontend:
          filters:
            tags:
              ignore: /.*/
      - release:
          requires:
            - php-tests
            - frontend
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
